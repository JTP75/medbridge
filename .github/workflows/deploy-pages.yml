name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "portal/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - run: npm ci

      # Static export only: no backend is hosted on Pages, so the frontend
      # falls back to its built-in preview/demo data automatically (see
      # next.config.ts's NEXT_BUILD_TARGET=github-pages branch).
      - run: npm run build
        env:
          NEXT_BUILD_TARGET: github-pages

      # GitHub Pages runs Jekyll by default, which ignores `_next/` (leading
      # underscore) and would silently break every JS/CSS asset without this.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
